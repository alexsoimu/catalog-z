<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog-Z</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
</head>

<body>

    <header>
        <nav>
            <div>
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-film"></i>
                    <span class="logo_text">Catalog-Z</span>
                </a>
            </div>
            <ul class="navigation">
                <li><a href="" class="navigation_link">Photos</a></li>
                <li><a href="" class="navigation_link">Videos</a></li>
                <li><a href="" class="navigation_link">About</a></li>
                <li><a href="" class="navigation_link">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="search">
        <input type="search" placeholder="Search">
        <button>
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>

    <div class="photos_title">
        <h2>Latest Photo</h2>
        <p>Page <span>1</span> of 200</p>
    </div>

    <div class="photos">
        <div class="photo">
            <div class="phot_img">
                <img src="/images/img-03.jpg" alt="clocks">
            </div>
            <div class="pfoto_info">
                <p>18 Oct 2020</p>
                <p>9,906 views</p>
            </div>
        </div>


        <div class="photo">
            <div class="phot_img">
                <img src="/images/img-04.jpg" alt="plants">
            </div>
            <div class="pfoto_info">
                <p>14 Oct 2020</p>
                <p>16,100 views</p>
            </div>
        </div>


        <div class="photo">
            <div class="phot_img">
                <img src="/images/img-05.jpg" alt="morning">
            </div>
            <div class="pfoto_info">
                <p>12 Oct 2020</p>
                <p>12,460 views</p>
            </div>
        </div>


        <div class="photo">
            <div class="phot_img">
                <img src="/images/img-06.jpg" alt="pinky">
            </div>
            <div class="pfoto_info">
                <p>10 Oct 2020</p>
                <p>11,402 views</p>
            </div>
        </div>
    </div>

    <div class="photos photos_margin">
        <div class="photo">
            <div class="phot_img">
                <img src="/images/img-01.jpg" alt="hangers">
            </div>
            <div class="pfoto_info">
                <p>24 Sep 2020</p>
                <p>16,008 views</p>
            </div>
        </div>


        <div class="photo">
            <div class="phot_img">
                <img src="/images/img-02.jpg" alt="perfumes">
            </div>
            <div class="pfoto_info">
                <p>20 Sep 2020</p>
                <p>12,860 views</p>
            </div>
        </div>


        <div class="photo">
            <div class="phot_img">
                <img src="/images/img-07.jpg" alt="bus">
            </div>
            <div class="pfoto_info">
                <p>16 Sep 2020</p>
                <p>10,900 views</p>
            </div>
        </div>


        <div class="photo">
            <div class="phot_img">
                <img src="/images/img-08.jpg" alt="New York">
            </div>
            <div class="pfoto_info">
                <p>12 Sep 2020</p>
                <p>11,300 views</p>
            </div>
        </div>
    </div>

    <div class="btn">
        <div class="btn_prev">
            <button>Previous</button>
        </div>
        <div class="btn_current">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
        </div>
        <div class="btn_next">
            <button>Next Page</button>
        </div>
    </div>

</body>

</html>
